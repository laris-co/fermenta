    <!--
      THESIS: A fermentation is a line, and the only question is whether the line
      is behaving. This refuses the card-grid dashboard, where every vessel is an
      equal rounded box and the trace is a thumbnail.
      OWN-WORLD: Procedurally banded charcoal continuum, bone legends, one
      grotesque at one size ranked by tracking and ink. Colour exists ONLY as
      needle-thin emission hairlines at real wavelengths (405/436/486/546/589/
      615/656nm). Everything hangs off one off-centre calibrated rail.
      STORY: The brewer opens it warm and one-handed, reads the rail, sees which
      vessel's line is drifting, opens that plate, logs a hydrometer reading.
      FIRST VIEWPORT: Rail pinned left at 1/3; vessel ticks on it, the open one
      bloomed into a full-height plate right of the rail carrying the live
      temperature trace; primary action (LOG READING) bottom-right of the plate.
      FORM: emission-line rail, challenger that beat grounded candidate 4
      (brewer's ledger) on both axes. Seed key 9c2ceda8.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying
      its provenance.
    -->
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
