server {
    # Ingress reaches the add-on on this port. It is never published to the LAN.
    listen 8099 default_server;
    root /var/www;
    index index.html;

    # Vite is built with base:"" so every asset URL is relative. That is what
    # makes the bundle work under ingress, where the path prefix is a random
    # per-session token (/api/hassio_ingress/<token>/) unknown at build time.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed; index.html must never be cached or a stale
    # shell will keep requesting assets that no longer exist after an update.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
