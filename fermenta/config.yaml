name: Fermenta
version: "0.1.0"
slug: fermenta
description: >-
  Fermentation tracking that reads temperature straight off MQTT. Machine
  readings are dense and continuous; gravity and pH are yours to log. A stall
  shows up as a shape, not a gap.
url: https://github.com/laris-co/fermenta
arch:
  - amd64
  - aarch64
# init: FALSE — and the reason is the opposite of what it looks like.
#
# This add-on is "just nginx serving static files", so init: true looked right.
# It is not: the HOME ASSISTANT BASE IMAGE itself ships s6-overlay. With
# init: true, Supervisor inserts its own init as PID 1 and s6 dies at startup:
#   s6-overlay-suexec: fatal: can only run as pid 1
# Any add-on built FROM ghcr.io/home-assistant/*-base needs init: false,
# regardless of how simple the add-on's own payload is.
init: false
startup: application
boot: auto
# ingress: true is what makes this a sidebar app; panel_icon/panel_title style
# the entry. There is NO `ingress_panel` key in config.yaml — verified against
# esphome, configurator, node-red and vscode, none of which use one.
#
# `ingress_panel` DOES exist, but as per-add-on SUPERVISOR RUNTIME state (the
# "Show in sidebar" toggle), settable via POST /addons/<slug>/options. That
# distinction matters after install: on a real guest, 8 of 9 add-ons were found
# sitting at ingress:true / ingress_panel:false, i.e. a working UI reachable only
# via Settings > Add-ons. If this add-on installs without a sidebar entry, that
# runtime flag is why, not this file.
ingress: true
ingress_port: 8099
panel_icon: mdi:beer-outline
panel_title: Fermenta
# No published port: everything is reached through HA's authenticated ingress,
# so the app never implements a login of its own.
options: {}
schema: {}
